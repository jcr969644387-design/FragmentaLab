name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-universal-apk:
    name: Generar APK universal de release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Unit and widget tests
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Verify single APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          # Flutter copia el mismo APK a apk/release/ y a flutter-apk/; se
          # cuenta solo la salida de Flutter, que es la que se publica. Si
          # apareciera mas de un APK (por ejemplo, uno por ABI) el paso falla.
          total=$(find build/app/outputs/flutter-apk -name "*.apk" | wc -l)
          if [ "$total" -ne 1 ]; then
            echo "Se esperaba exactamente 1 APK y se encontraron $total:"
            find build/app/outputs/flutter-apk -name "*.apk"
            exit 1
          fi
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: fragmenta-lab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
